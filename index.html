<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>أمير سوفت</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أمير سوفت">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0c10;--ink:#eef0f4;--ink2:#a2aab8;--ink3:#6a7282;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);--acc:#8aa9ff;--acc-rgb:138,169,255;--ease:cubic-bezier(.32,.72,0,1);--pop:cubic-bezier(.34,1.5,.64,1);--r:16px;--r-sm:12px}
.m-all{--c:200,208,224}.m-finished,.st-done,.sb-done{--c:104,212,166}.m-working,.st-inprogress,.sb-inprogress{--c:128,166,255}.st-waiting,.sb-waiting{--c:236,184,98}.m-unrepaired,.st-unrepaired,.sb-unrepaired{--c:255,130,120}.st-delivered,.sb-delivered{--c:150,160,178}
body{background:radial-gradient(120% 50% at 50% -8%,rgba(138,169,255,.11),transparent 62%) fixed,var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Tahoma,"Noto Sans Arabic",sans-serif;font-size:14px;line-height:1.45;min-height:100vh;padding-bottom:120px;direction:rtl;-webkit-font-smoothing:antialiased}
.chrome{position:sticky;top:0;z-index:10;background:rgba(10,12,16,.72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#2a3350,#171c2b);border:1px solid rgba(var(--acc-rgb),.28);box-shadow:0 0 18px -6px rgba(var(--acc-rgb),.6)}
.top-actions{display:flex;gap:8px}
.tabs{display:flex;gap:6px;padding:6px 12px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 10px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--ink3);font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .3s var(--ease),color .2s,border-color .3s,transform .2s var(--ease)}
.tab:active{transform:scale(.96)}
.tab.active{color:var(--ink);background:rgba(255,255,255,.07);border-color:var(--line2)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:rgba(255,255,255,.07);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
.tab.active .count{background:rgba(var(--c),.18);color:rgb(var(--c))}
.bump{animation:bump .45s var(--pop)}
@keyframes bump{40%{transform:scale(1.22)}}
.page{padding:14px 14px 0;display:none}
.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.metric{text-align:start;padding:12px 12px 11px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),#12151b;color:var(--ink);font-family:inherit;cursor:pointer;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 24px -14px rgba(0,0,0,.8);transition:transform .2s var(--ease),border-color .3s,box-shadow .3s}
.metric:active{transform:scale(.97)}
.metric.active{border-color:rgba(var(--c),.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(var(--c),.1),0 12px 28px -14px rgba(var(--c),.5)}
.metric-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.metric-label::before{content:"";width:6px;height:6px;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 8px rgba(var(--c),.9)}
.metric-value{width:fit-content;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.metric-sub{font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;margin-top:-8px;color:var(--ink3);pointer-events:none}
.search input{width:100%;padding:12px 14px;padding-inline-start:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:border-color .25s,box-shadow .25s}
.search input::placeholder{color:var(--ink3)}
.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(var(--acc-rgb),.5);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.14)}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.chips:empty{display:none}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink2);font-family:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip b{margin-inline-start:6px;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums}
.chip.active{background:rgba(var(--acc-rgb),.14);border-color:rgba(var(--acc-rgb),.3);color:#cfdcff}
.device-card,.part-card{position:relative;overflow:hidden;margin-bottom:10px;padding:14px 16px 12px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.014) 55%),#12151b;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 1px 2px rgba(0,0,0,.4),0 14px 28px -16px rgba(0,0,0,.85);cursor:pointer;transition:transform .2s var(--ease),box-shadow .3s}
.device-card:active,.part-card:active{transform:scale(.98)}
.device-card::before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:3px;border-radius:3px;background:rgb(var(--c));box-shadow:0 0 14px rgba(var(--c),.7)}
.device-card.st-delivered{opacity:.7}
.enter{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i)*35ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.dc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.device-id{direction:ltr;unicode-bidi:isolate;font-size:13px;font-weight:700;letter-spacing:-.02em;color:#b9c8ff;font-variant-numeric:tabular-nums}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;color:rgb(var(--c));background:rgba(var(--c),.11);border:1px solid rgba(var(--c),.18)}
.status-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.device-name{font-size:16px;font-weight:650;letter-spacing:-.01em}
.device-model{font-size:13px;color:var(--ink2);margin-top:1px}
.device-issue{font-size:12.5px;color:var(--ink3);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unrepaired-reason{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:12.5px;color:#ffa296;background:rgba(255,130,120,.08);border:1px solid rgba(255,130,120,.14)}
.dc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05);font-size:12px;color:var(--ink3)}
.dc-meta,.dc-end{display:flex;align-items:center;gap:10px}
.price{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.device-shelf,.shelf-big{direction:ltr;display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.device-shelf small{font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:0}
.shelf-big{font-size:24px;padding:4px 16px;border-radius:12px;letter-spacing:.04em}
.empty{text-align:center;padding:56px 24px;color:var(--ink3);line-height:1.7}
.btn{padding:10px 15px;border-radius:var(--r-sm);border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .2s var(--ease),background .25s,opacity .2s}
.btn:active{transform:scale(.97);background:rgba(255,255,255,.09)}
.btn-sm{padding:8px 13px;font-size:12.5px}
.btn-primary{background:linear-gradient(180deg,#a0b8ff,#7f9ff2);border-color:transparent;color:#0a1230;box-shadow:0 8px 20px -10px rgba(var(--acc-rgb),.8)}
.btn-primary:active{background:linear-gradient(180deg,#a0b8ff,#7f9ff2);opacity:.88}
.btn-green{background:rgba(104,212,166,.14);border-color:rgba(104,212,166,.3);color:#7fe0b6}
.btn-purple{background:rgba(176,150,255,.14);border-color:rgba(176,150,255,.3);color:#c5b3ff}
.btn-red{background:rgba(255,130,120,.08);border-color:rgba(255,130,120,.2);color:#ff9a8f}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:16px;width:56px;height:56px;border-radius:20px;background:linear-gradient(180deg,#a0b8ff,#7f9ff2);border:none;color:#0a1230;font-size:28px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px rgba(var(--acc-rgb),.75),inset 0 1px 0 rgba(255,255,255,.4);z-index:20;transition:transform .25s var(--ease)}
.fab:active{transform:scale(.92) rotate(90deg)}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s linear .35s}
#unrepaired-sheet{z-index:60}
.overlay.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s}
.sheet{position:relative;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;direction:rtl;padding:26px 18px calc(28px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;border-top:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,#1b2029,#12151b);box-shadow:0 -20px 50px -10px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .45s var(--ease)}
.overlay.open .sheet{transform:none}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,255,255,.14)}
.sheet-title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.close-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.07);border:none;color:var(--ink2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease)}
.close-btn:active{transform:scale(.9)}
.field{margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 12px;color:var(--ink);font-size:16px;font-family:inherit;outline:none;transition:border-color .25s,box-shadow .25s}
.field select option{background:#1b2029}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;gap:8px;margin-top:18px;flex-direction:row-reverse}
.sheet-actions .btn{flex:1}
.backup-section{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.backup-title{font-size:14px;font-weight:700;margin-bottom:6px}
.backup-desc{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.backup-row{display:flex;gap:8px}
.divider{height:1px;background:var(--line);margin:14px 0}
.detail-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.d-id{direction:ltr;text-align:center;font-size:36px;font-weight:700;letter-spacing:-.04em;color:#c4d1ff;font-variant-numeric:tabular-nums}
.d-badge{text-align:center;margin:8px 0 2px}
.d-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.d-phone{font-size:13px;color:var(--ink2);direction:ltr;text-align:start}
.d-model{font-size:15px;font-weight:600}
.d-sub{font-size:13px;color:var(--ink2);margin-top:2px}
.d-note{font-size:12.5px;color:var(--ink2);background:rgba(255,255,255,.04);border:1px solid var(--line);padding:9px 11px;border-radius:10px;margin-top:10px}
.d-price{font-size:18px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}
.d-date{font-size:12px;color:var(--ink3);margin:12px 0 16px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.d-actions .btn{flex:1 1 120px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="chrome">
  <div class="topbar">
    <div class="brand">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#b9c8ff" stroke-width="1.4" stroke-linecap="round"><rect x="4" y="4" width="8" height="8" rx="1.8"/><path d="M6.5 1.5V4M9.5 1.5V4M6.5 12v2.5M9.5 12v2.5M1.5 6.5H4M1.5 9.5H4M12 6.5h2.5M12 9.5h2.5"/></svg></span>
      <span>أمير سوفت</span>
    </div>
    <div class="top-actions">
      <button class="btn btn-sm" id="lang-btn" onclick="toggleLang()" style="min-width:44px">EN</button>
      <button class="btn btn-sm" onclick="openBackup()"><span data-ar="نسخ" data-en="Backup">نسخ</span></button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab m-all" role="tab" data-view="all" onclick="setView('all')"><span data-k="tabAll">الكل</span><span class="count" id="tc-all"></span></button>
    <button class="tab m-finished" role="tab" data-view="finished" onclick="setView('finished')"><span data-k="tabFinished">منتهية</span><span class="count" id="tc-finished"></span></button>
    <button class="tab m-working" role="tab" data-view="working" onclick="setView('working')"><span data-k="tabWorking">قيد العمل</span><span class="count" id="tc-working"></span></button>
    <button class="tab m-unrepaired" role="tab" data-view="unrepaired" onclick="setView('unrepaired')"><span data-k="tabUnrepaired">لم تُصلح</span><span class="count" id="tc-unrepaired"></span></button>
  </nav>
</header>

<!-- الأجهزة -->
<div id="page-devices" class="page active">
  <div class="cards">
    <button class="metric m-finished" data-view="finished" onclick="setView('finished')"><div class="metric-label" data-k="mFinished">منتهية</div><div class="metric-value" id="dstat-finished"></div><div class="metric-sub" id="dsub-finished"></div></button>
    <button class="metric m-working" data-view="working" onclick="setView('working')"><div class="metric-label" data-k="mWorking">قيد العمل</div><div class="metric-value" id="dstat-working"></div><div class="metric-sub" id="dsub-working"></div></button>
    <button class="metric m-unrepaired" data-view="unrepaired" onclick="setView('unrepaired')"><div class="metric-label" data-k="mUnrepaired">لم تُصلح</div><div class="metric-value" id="dstat-unrepaired"></div><div class="metric-sub" id="dsub-unrepaired"></div></button>
  </div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6 14 14"/></svg>
    <input type="text" id="device-search" placeholder="بحث بالاسم أو الموديل أو الرقم..." oninput="animate=false;renderDevices()">
  </div>
  <div class="chips" id="sub-chips"></div>
  <div id="devices-list"></div>
</div>

<button class="fab" onclick="openAddDevice()" id="fab-btn">+</button>

<!-- إضافة/تعديل جهاز -->
<div class="overlay" id="device-sheet">
  <div class="sheet">
    <div class="sheet-title">
      <span id="dsheet-title">طلب إصلاح جديد</span>
      <button class="close-btn" onclick="closeSheet('device-sheet')">✕</button>
    </div>
    <div class="row2">
      <div class="field"><label>اسم العميل</label><input type="text" id="d-customer" placeholder="مثال: أحمد علي"></div>
      <div class="field"><label>رقم الهاتف</label><input type="tel" id="d-phone" placeholder="07XX XXX XXXX" inputmode="tel" style="direction:ltr"></div>
    </div>
    <div class="row2">
      <div class="field"><label>موديل الجهاز</label><input type="text" id="d-model" placeholder="مثال: Samsung A54"></div>
      <div class="field"><label>رقم الرف</label><input type="text" id="d-shelf" placeholder="مثال: A3" style="text-transform:uppercase;direction:ltr"></div>
    </div>
    <div class="field"><label>المشكلة</label><input type="text" id="d-issue" placeholder="مثال: شاشة مكسورة، لا يشحن..."></div>
    <div class="row2">
      <div class="field"><label>نوع الإصلاح</label>
        <select id="d-type">
          <option value="إصلاح بورد">إصلاح بورد</option>
          <option value="سوفت وير">سوفت وير</option>
          <option value="أخرى">أخرى</option>
        </select>
      </div>
      <div class="field"><label>السعر المتفق (د.ع)</label><input type="number" id="d-price" min="0" step="250" placeholder="0" inputmode="decimal" style="direction:ltr"></div>
    </div>
    <div class="field"><label>ملاحظات</label><textarea id="d-notes" rows="2" placeholder="الباسورد، الملحقات، تعليمات خاصة..."></textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-primary" onclick="saveDevice()">حفظ</button>
      <button class="btn" onclick="closeSheet('device-sheet')">إلغاء</button>
      <button class="btn btn-red" id="d-delete-btn" onclick="deleteDevice()" style="display:none;flex:0;padding:9px 14px">🗑</button>
    </div>
  </div>
</div>

<!-- سبب عدم الإصلاح -->
<div class="overlay" id="unrepaired-sheet">
  <div class="sheet">
    <div class="sheet-title">
      <span id="usheet-title">لم يصلح الجهاز</span>
      <button class="close-btn" onclick="closeSheet('unrepaired-sheet')">✕</button>
    </div>
    <div class="field"><label id="u-reason-label">سبب عدم الإصلاح</label><textarea id="u-reason" rows="3" placeholder="مثال: القطعة غير متوفرة، الضرر أكبر من المتوقع، العميل لم يوافق على السعر..."></textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-primary" onclick="confirmUnrepaired()" id="u-confirm-btn">✓ تأكيد</button>
      <button class="btn" onclick="closeSheet('unrepaired-sheet')" id="u-cancel-btn">إلغاء</button>
    </div>
  </div>
</div>

<!-- تفاصيل الجهاز -->
<div class="overlay" id="detail-sheet">
  <div class="sheet">
    <div class="sheet-title">
      <span>تفاصيل الإصلاح</span>
      <button class="close-btn" onclick="closeSheet('detail-sheet')">✕</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<!-- نسخ احتياطي -->
<div class="overlay" id="backup-sheet">
  <div class="sheet">
    <div class="sheet-title">
      <span>النسخ الاحتياطي</span>
      <button class="close-btn" onclick="closeSheet('backup-sheet')">✕</button>
    </div>
    <div class="backup-section">
      <div class="backup-title">تصدير نسخة احتياطية</div>
      <div class="backup-desc">يحفظ جميع طلبات الإصلاح وبيانات العملاء في ملف JSON. احفظه على Google Drive أو أرسله لنفسك.</div>
      <div class="backup-row"><button class="btn btn-primary" onclick="exportData()" style="flex:1">تنزيل النسخة الاحتياطية</button></div>
    </div>
    <div class="backup-section">
      <div class="backup-title">استعادة من نسخة احتياطية</div>
      <div class="backup-desc">اختر ملف النسخة الاحتياطية. سيستبدل جميع البيانات الحالية.</div>
      <div class="backup-row">
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn" onclick="document.getElementById('import-file').click()" style="flex:1">اختر ملف</button>
      </div>
    </div>
    <button class="btn" onclick="closeSheet('backup-sheet')" style="width:100%;justify-content:center;margin-top:4px">إغلاق</button>
  </div>
</div>

<script>
let devices = JSON.parse(localStorage.getItem('devices_v1') || '[]');
let editDeviceId=null, unrepairedDeviceId=null;
let jobCounter = parseInt(localStorage.getItem('job_counter')||'0');

function save(){
  localStorage.setItem('devices_v1',JSON.stringify(devices));
  localStorage.setItem('job_counter',String(jobCounter));
}
function money(n){return Number(n).toLocaleString('en-US')+((localStorage.getItem('lang')||'ar')==='ar'?' د.ع':' IQD');}
function nextJobId(){ jobCounter++; return 'J-'+String(jobCounter).padStart(4,'0'); }
function closeSheet(id){ document.getElementById(id).classList.remove('open'); }

/* ---- الأجهزة ---- */
function statusInfo(s){
  if(s==='waiting')    return {text:'بانتظار الإصلاح', cls:'sb-waiting'};
  if(s==='inprogress') return {text:'قيد الإصلاح',     cls:'sb-inprogress'};
  if(s==='done')       return {text:'جاهز ✓',           cls:'sb-done'};
  if(s==='delivered')  return {text:'تم التسليم',       cls:'sb-delivered'};
  if(s==='unrepaired') return {text:'لم يصلح',           cls:'sb-unrepaired'};
  return {text:s,cls:'sb-waiting'};
}
function openAddDevice(){
  editDeviceId=null;
  document.getElementById('dsheet-title').textContent='طلب إصلاح جديد';
  document.getElementById('d-delete-btn').style.display='none';
  ['customer','phone','model','shelf','issue','notes'].forEach(f=>document.getElementById('d-'+f).value='');
  document.getElementById('d-price').value='';
  document.getElementById('d-type').value='سوفت وير';
  document.getElementById('device-sheet').classList.add('open');
}
function openEditDevice(id){
  const d=devices.find(x=>x.id===id); if(!d) return;
  editDeviceId=id;
  document.getElementById('dsheet-title').textContent='تعديل '+d.jobId;
  document.getElementById('d-delete-btn').style.display='inline-flex';
  document.getElementById('d-customer').value=d.customer;
  document.getElementById('d-phone').value=d.phone||'';
  document.getElementById('d-model').value=d.model;
  document.getElementById('d-shelf').value=d.shelf||'';
  document.getElementById('d-issue').value=d.issue||'';
  document.getElementById('d-type').value=d.type;
  document.getElementById('d-price').value=d.price||'';
  document.getElementById('d-notes').value=d.notes||'';
  document.getElementById('device-sheet').classList.add('open');
}
function saveDevice(){
  const customer=document.getElementById('d-customer').value.trim();
  const model=document.getElementById('d-model').value.trim();
  if(!customer){alert('أدخل اسم العميل');return;}
  if(!model){alert('أدخل موديل الجهاز');return;}
  const shelf=(document.getElementById('d-shelf').value.trim()||'').toUpperCase();
  if(editDeviceId){
    const d=devices.find(x=>x.id===editDeviceId);
    Object.assign(d,{customer,model,shelf,
      phone:document.getElementById('d-phone').value.trim(),
      issue:document.getElementById('d-issue').value.trim(),
      type:document.getElementById('d-type').value,
      price:parseFloat(document.getElementById('d-price').value)||0,
      notes:document.getElementById('d-notes').value.trim(),
      updatedAt:new Date().toISOString()
    });
  } else {
    devices.unshift({
      id:Date.now(), jobId:nextJobId(),
      customer, model, shelf,
      phone:document.getElementById('d-phone').value.trim(),
      issue:document.getElementById('d-issue').value.trim(),
      type:document.getElementById('d-type').value,
      price:parseFloat(document.getElementById('d-price').value)||0,
      notes:document.getElementById('d-notes').value.trim(),
      status:'waiting',
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString()
    });
  }
  save(); closeSheet('device-sheet'); renderDevices(); updateDeviceStats();
}
function deleteDevice(){
  if(!confirm('حذف هذا الطلب؟')) return;
  devices=devices.filter(x=>x.id!==editDeviceId);
  save(); closeSheet('device-sheet'); renderDevices(); updateDeviceStats();
}
function setStatus(id,status){
  const d=devices.find(x=>x.id===id); if(!d) return;
  d.status=status; d.updatedAt=new Date().toISOString();
  if(status==='delivered') d.deliveredAt=new Date().toISOString();
  if(status!=='unrepaired') d.unrepairedReason='';
  save(); closeSheet('detail-sheet'); renderDevices(); updateDeviceStats();
}
function openUnrepairedSheet(id){
  unrepairedDeviceId=id;
  const d=devices.find(x=>x.id===id);
  document.getElementById('u-reason').value=(d&&d.unrepairedReason)||'';
  document.getElementById('unrepaired-sheet').classList.add('open');
}
function confirmUnrepaired(){
  const d=devices.find(x=>x.id===unrepairedDeviceId); if(!d) return;
  d.status='unrepaired';
  d.unrepairedReason=document.getElementById('u-reason').value.trim();
  d.updatedAt=new Date().toISOString();
  save(); closeSheet('unrepaired-sheet'); closeSheet('detail-sheet'); renderDevices(); updateDeviceStats();
}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const GROUPS={finished:['done','delivered'],working:['inprogress','waiting'],unrepaired:['unrepaired']};
let view=localStorage.getItem('view_v1')||'all', sub='', animate=true;
if(view!=='all'&&!GROUPS[view]) view='all';
function setView(v){view=v;sub='';animate=true;localStorage.setItem('view_v1',v);renderDevices();window.scrollTo({top:0,behavior:'smooth'});}
function setSub(s){sub=s;animate=false;renderDevices();}
function openDetail(id){
  const d=devices.find(x=>x.id===id); if(!d) return;
  const l=t(), si=statusInfo(d.status), loc=currentLang==='ar'?'ar-IQ':'en-GB', c=new Date(d.createdAt);
  const ds=c.toLocaleDateString(loc)+' '+c.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});
  let btns='';
  if(d.status==='waiting')    btns+=`<button class="btn btn-primary btn-sm" onclick="setStatus(${d.id},'inprogress')">${l.startBtn}</button>`;
  if(d.status==='inprogress') btns+=`<button class="btn btn-green btn-sm" onclick="setStatus(${d.id},'done')">${l.doneBtn}</button>`;
  if(d.status==='done')       btns+=`<button class="btn btn-purple btn-sm" onclick="setStatus(${d.id},'delivered')">${l.deliveredBtn}</button>`;
  if(d.status==='waiting'||d.status==='inprogress') btns+=`<button class="btn btn-red btn-sm" onclick="openUnrepairedSheet(${d.id})">${l.notRepairedBtn}</button>`;
  btns+=`<button class="btn btn-sm" onclick="closeSheet('detail-sheet');openEditDevice(${d.id})">${l.editBtn}</button>`;
  document.getElementById('detail-body').innerHTML=`
    <div class="d-id">${esc(d.jobId)}</div>
    <div class="d-badge"><span class="status-badge sb-${d.status}">${si.text}</span></div>
    <div class="divider"></div>
    <div class="detail-row">
      <div><div class="d-name">${esc(d.customer)}</div>${d.phone?`<div class="d-phone">${esc(d.phone)}</div>`:''}</div>
      ${d.shelf?`<div class="shelf-big">${esc(d.shelf)}</div>`:''}
    </div>
    <div class="d-model">${esc(d.model)}</div>
    <div class="d-sub">${esc(d.type)}</div>
    ${d.issue?`<div class="d-sub">${esc(d.issue)}</div>`:''}
    ${d.status==='unrepaired'&&d.unrepairedReason?`<div class="unrepaired-reason"><b>${l.reasonLabel}:</b> ${esc(d.unrepairedReason)}</div>`:''}
    ${d.price?`<div class="d-price">${money(d.price)}</div>`:''}
    ${d.notes?`<div class="d-note">${esc(d.notes)}</div>`:''}
    <div class="d-date">${l.receivedLabel} ${ds}</div>
    <div class="d-actions">${btns}</div>`;
  document.getElementById('detail-sheet').classList.add('open');
}
function renderDevices(){
  const l=t(), q=(document.getElementById('device-search').value||'').toLowerCase();
  const grp=GROUPS[view]||null, rank={inprogress:0,waiting:1,done:0,delivered:1};
  const list=devices.filter(d=>{
    if(grp&&!grp.includes(d.status)) return false;
    if(sub&&d.status!==sub) return false;
    return !q||(d.jobId+' '+d.customer+' '+d.model+' '+(d.shelf||'')+' '+(d.issue||'')).toLowerCase().includes(q);
  });
  if(grp) list.sort((a,b)=>(rank[a.status]||0)-(rank[b.status]||0));
  const names={waiting:l.waiting,inprogress:l.inprogress,done:l.doneF,delivered:l.delivered};
  const inView=devices.filter(d=>!grp||grp.includes(d.status));
  document.getElementById('sub-chips').innerHTML=(grp&&grp.length>1)
    ?[['',l.allFilter,inView.length]].concat(grp.map(s=>[s,names[s],devices.filter(d=>d.status===s).length]))
      .map(c=>`<button class="chip${sub===c[0]?' active':''}" onclick="setSub('${c[0]}')">${c[1]}<b>${c[2]}</b></button>`).join(''):'';
  const el=document.getElementById('devices-list');
  if(!list.length){el.innerHTML=`<div class="empty">${view==='all'?l.emptyDevices:l.empty[view]}</div>`;animate=false;updateDeviceStats();return;}
  el.innerHTML=list.map((d,i)=>{
    const si=statusInfo(d.status);
    const ds=new Date(d.createdAt).toLocaleDateString(currentLang==='ar'?'ar-IQ':'en-GB');
    return `<div class="device-card st-${d.status}${animate?' enter':''}" style="--i:${Math.min(i,8)}" onclick="openDetail(${d.id})">
      <div class="dc-top"><span class="device-id">${esc(d.jobId)}</span><span class="status-badge sb-${d.status}">${si.text}</span></div>
      <div class="device-name">${esc(d.customer)}</div>
      <div class="device-model">${esc(d.model)}</div>
      ${d.issue?`<div class="device-issue">${esc(d.issue)}</div>`:''}
      ${d.status==='unrepaired'&&d.unrepairedReason?`<div class="unrepaired-reason">${esc(d.unrepairedReason)}</div>`:''}
      <div class="dc-foot">
        <div class="dc-meta"><span>${esc(d.type)}</span><span>${ds}</span></div>
        <div class="dc-end">${d.price?`<span class="price">${money(d.price)}</span>`:''}${d.shelf?`<span class="device-shelf"><small>${l.shelfLabel}</small>${esc(d.shelf)}</span>`:''}</div>
      </div>
    </div>`;
  }).join('');
  animate=false;
  updateDeviceStats();
}
function setCount(id,n){
  const e=document.getElementById(id); if(!e) return; const v=String(n);
  if(e.textContent===v) return;
  const had=e.textContent!==''; e.textContent=v;
  if(had){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');}
}
function updateDeviceStats(){
  const c=s=>devices.filter(d=>d.status===s).length, l=t();
  const fin=c('done')+c('delivered'), wrk=c('waiting')+c('inprogress'), bad=c('unrepaired'), tot=devices.length;
  [['finished',fin],['working',wrk],['unrepaired',bad]].forEach(p=>{setCount('dstat-'+p[0],p[1]);setCount('tc-'+p[0],p[1]);});
  setCount('tc-all',tot);
  document.getElementById('dsub-finished').textContent=l.subReady(c('done'));
  document.getElementById('dsub-working').textContent=l.subWaiting(c('waiting'));
  document.getElementById('dsub-unrepaired').textContent=l.subShare(tot?Math.round(bad/tot*100):0);
  document.querySelectorAll('[data-view]').forEach(e=>{const on=e.dataset.view===view;e.classList.toggle('active',on);if(e.getAttribute('role')==='tab')e.setAttribute('aria-selected',on);});
}

function openBackup(){document.getElementById('backup-sheet').classList.add('open');}
function exportData(){
  const data={devices,jobCounter,exported:new Date().toISOString(),version:3};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='نسخة_احتياطية_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.devices){alert('ملف غير صالح.');return;}
      if(!confirm('سيتم استبدال جميع البيانات الحالية. هل أنت متأكد؟')) return;
      devices=data.devices||[]; jobCounter=data.jobCounter||0;
      save(); renderDevices(); updateDeviceStats();
      closeSheet('backup-sheet');
      alert('تم الاستعادة! '+devices.length+' جهاز.');
    } catch(err){alert('تعذر قراءة الملف.');}
  };
  reader.readAsText(file); e.target.value='';
}
/* ---- تبديل اللغة ---- */
let currentLang = localStorage.getItem('lang') || 'ar';

const T = {
  ar: {
    jobs:'الأجهزة',
    active:'نشط', done:'جاهز', total:'الكل',
    searchDevice:'بحث بالاسم أو الموديل أو الرقم...',
    allFilter:'الكل', waiting:'بانتظار الإصلاح', inprogress:'قيد الإصلاح', doneF:'جاهز', delivered:'تم التسليم',
    newJob:'طلب إصلاح جديد', customerName:'اسم العميل', phoneNum:'رقم الهاتف',
    deviceModel:'موديل الجهاز', shelf:'رقم الرف', problem:'المشكلة',
    repairType:'نوع الإصلاح', agreedPrice:'السعر المتفق (د.ع)', notes:'ملاحظات',
    save:'حفظ', cancel:'إلغاء',
    confirm:'✓ تأكيد', repairDetail:'تفاصيل الإصلاح', backup:'نسخ',
    types:['إصلاح بورد','سوفت وير','أخرى'],
    statusWaiting:'بانتظار الإصلاح', statusInprogress:'قيد الإصلاح', statusDone:'جاهز ✓', statusDelivered:'تم التسليم', statusUnrepaired:'لم يصلح',
    startBtn:'▶ بدء الإصلاح', doneBtn:'✓ جاهز', deliveredBtn:'تم التسليم', editBtn:'تعديل', notRepairedBtn:'✕ لم يصلح',
    notRepairedTitle:'لم يصلح الجهاز', reasonLabel:'سبب عدم الإصلاح',
    reasonPlaceholder:'مثال: القطعة غير متوفرة، الضرر أكبر من المتوقع، العميل لم يوافق على السعر...',
    shelfLabel:'الرف', receivedLabel:'استُلم:', emptyDevices:'لا توجد أجهزة.<br>اضغط + لإضافة جهاز جديد.',
    deleteDevice:'حذف هذا الطلب؟',
    enterCustomer:'أدخل اسم العميل', enterModel:'أدخل موديل الجهاز',
    backupTitle:'النسخ الاحتياطي', exportTitle:'تصدير نسخة احتياطية',
    exportDesc:'يحفظ جميع طلبات الإصلاح وبيانات العملاء في ملف JSON.',
    downloadBtn:'تنزيل النسخة الاحتياطية', restoreTitle:'استعادة من نسخة احتياطية',
    restoreDesc:'اختر ملف النسخة الاحتياطية. سيستبدل جميع البيانات الحالية.',
    chooseFile:'اختر ملف', close:'إغلاق',
    invalidFile:'ملف غير صالح.', cannotRead:'تعذر قراءة الملف.',
    replaceConfirm:'سيتم استبدال جميع البيانات الحالية. هل أنت متأكد؟',
    editJob: id=>'تعديل '+id,
    tabAll:'الكل', tabFinished:'منتهية', tabWorking:'قيد العمل', tabUnrepaired:'لم تُصلح',
    mFinished:'منتهية', mWorking:'قيد العمل', mUnrepaired:'لم تُصلح',
    subReady:n=>n+' جاهز للتسليم', subWaiting:n=>n+' لم يبدأ', subShare:p=>p+'% من الطلبات',
    empty:{finished:'لا توجد أجهزة منتهية بعد.', working:'لا توجد أجهزة قيد العمل.', unrepaired:'لا توجد أجهزة تعذّر إصلاحها.'},
    dir:'rtl', lang:'ar'
  },
  en: {
    jobs:'Jobs',
    active:'Active', done:'Done', total:'Total',
    searchDevice:'Search name, model, ID...',
    allFilter:'All', waiting:'Waiting', inprogress:'In Progress', doneF:'Done', delivered:'Delivered',
    newJob:'New Repair Job', customerName:'Customer Name', phoneNum:'Phone Number',
    deviceModel:'Device Model', shelf:'Shelf / Location', problem:'Problem / Issue',
    repairType:'Repair Type', agreedPrice:'Agreed Price (IQD)', notes:'Notes',
    save:'Save', cancel:'Cancel',
    confirm:'✓ Confirm', repairDetail:'Repair Job', backup:'Backup',
    types:['Motherboard repair','Software','Other'],
    statusWaiting:'Waiting', statusInprogress:'In Progress', statusDone:'Done ✓', statusDelivered:'Delivered', statusUnrepaired:'Not Repaired',
    startBtn:'▶ Start Repair', doneBtn:'✓ Mark Done', deliveredBtn:'Delivered', editBtn:'Edit', notRepairedBtn:'✕ Not Repaired',
    notRepairedTitle:'Device Not Repaired', reasonLabel:'Reason Not Repaired',
    reasonPlaceholder:'e.g. Part unavailable, damage worse than expected, customer declined the price...',
    shelfLabel:'Shelf', receivedLabel:'Received:',
    emptyDevices:'No repair jobs.<br>Tap + to add a device.',
    deleteDevice:'Delete this repair job?',
    enterCustomer:'Enter customer name', enterModel:'Enter device model',
    backupTitle:'Backup & Restore', exportTitle:'Export Backup',
    exportDesc:'Downloads all repair jobs and customer info as a JSON file.',
    downloadBtn:'Download Backup', restoreTitle:'Restore from Backup',
    restoreDesc:'Choose a backup file. This will replace all current data.',
    chooseFile:'Choose File', close:'Close',
    invalidFile:'Invalid backup file.', cannotRead:'Could not read file.',
    replaceConfirm:'This will replace ALL current data. Are you sure?',
    editJob: id=>'Edit '+id,
    tabAll:'All', tabFinished:'Finished', tabWorking:'Working', tabUnrepaired:'Unrepaired',
    mFinished:'Finished', mWorking:'Working on', mUnrepaired:'Unrepaired',
    subReady:n=>n+' ready for pickup', subWaiting:n=>n+' not started', subShare:p=>p+'% of jobs',
    empty:{finished:'No finished devices yet.', working:'Nothing in progress.', unrepaired:'No unrepaired devices.'},
    dir:'ltr', lang:'en'
  }
};

function t(){ return T[currentLang]; }

function toggleLang(){
  currentLang = currentLang==='ar' ? 'en' : 'ar';
  localStorage.setItem('lang', currentLang);
  applyLang();
  renderDevices();
}

function applyLang(){
  const l = t();
  const html = document.documentElement;
  html.setAttribute('dir', l.dir);
  html.setAttribute('lang', l.lang);
  document.body.style.direction = l.dir;

  // lang button
  document.getElementById('lang-btn').textContent = currentLang==='ar' ? 'EN' : 'ع';

  document.querySelectorAll('[data-k]').forEach(e=>{const v=l[e.dataset.k];if(typeof v==='string')e.textContent=v;});
  document.querySelectorAll('[data-ar]').forEach(e=>{e.textContent=e.dataset[currentLang];});
  document.getElementById('device-search').placeholder = l.searchDevice;

  // unrepaired reason sheet
  document.getElementById('usheet-title').textContent = l.notRepairedTitle;
  document.getElementById('u-reason-label').textContent = l.reasonLabel;
  document.getElementById('u-reason').placeholder = l.reasonPlaceholder;
  document.getElementById('u-confirm-btn').textContent = l.confirm;
  document.getElementById('u-cancel-btn').textContent = l.cancel;

  // device sheet
  document.getElementById('dsheet-title').textContent = l.newJob;
  setLabel('d-customer', l.customerName); setPlaceholder('d-customer', currentLang==='ar'?'مثال: أحمد علي':'e.g. Ahmed Ali');
  setLabel('d-phone', l.phoneNum);
  setLabel('d-model', l.deviceModel); setPlaceholder('d-model', 'e.g. Samsung A54');
  setLabel('d-shelf', l.shelf);
  setLabel('d-issue', l.problem); setPlaceholder('d-issue', currentLang==='ar'?'مثال: شاشة مكسورة، لا يشحن...':'e.g. Cracked screen, no charge...');
  setLabel('d-type', l.repairType);
  // repair type options
  const dt = document.getElementById('d-type');
  for(let i=0;i<dt.options.length;i++) dt.options[i].text = l.types[i];
  setLabel('d-price', l.agreedPrice);
  setLabel('d-notes', l.notes); document.getElementById('d-notes').placeholder = currentLang==='ar'?'الباسورد، الملحقات، تعليمات خاصة...':'Password, accessories, special instructions...';

  // device sheet buttons
  const dActions = document.querySelector('#device-sheet .sheet-actions');
  dActions.children[0].textContent = l.save;
  dActions.children[1].textContent = l.cancel;

  // detail sheet title
  document.querySelector('#detail-sheet .sheet-title span').textContent = l.repairDetail;

  // backup sheet
  document.querySelector('#backup-sheet .sheet-title span').textContent = l.backupTitle;
  const bs = document.querySelectorAll('#backup-sheet .backup-section');
  [[l.exportTitle,l.exportDesc,l.downloadBtn],[l.restoreTitle,l.restoreDesc,l.chooseFile]].forEach((v,i)=>{
    bs[i].querySelector('.backup-title').textContent = v[0];
    bs[i].querySelector('.backup-desc').textContent = v[1];
    bs[i].querySelector('button').textContent = v[2];
  });
  document.querySelector('#backup-sheet > .sheet > .btn:last-child').textContent = l.close;

  // fab direction
  document.getElementById('fab-btn').style.left = l.dir==='rtl' ? '16px' : 'auto';
  document.getElementById('fab-btn').style.right = l.dir==='ltr' ? '16px' : 'auto';

  // sheet directions
  document.querySelectorAll('.sheet').forEach(s=>s.style.direction=l.dir);
  document.querySelectorAll('.sheet-actions').forEach(sa=>{
    sa.style.flexDirection = l.dir==='rtl' ? 'row-reverse' : 'row';
  });
}

function setLabel(id, text){
  const el = document.getElementById(id);
  if(el && el.previousElementSibling && el.previousElementSibling.tagName==='LABEL')
    el.previousElementSibling.textContent = text;
  else {
    const field = el ? el.closest('.field') : null;
    if(field){ const lbl=field.querySelector('label'); if(lbl) lbl.textContent=text; }
  }
}
function setPlaceholder(id, text){ const el=document.getElementById(id); if(el) el.placeholder=text; }

// patch statusInfo to use t()
statusInfo = function(s){
  const l=t();
  if(s==='waiting')    return {text:l.statusWaiting,    cls:'sb-waiting'};
  if(s==='inprogress') return {text:l.statusInprogress, cls:'sb-inprogress'};
  if(s==='done')       return {text:l.statusDone,       cls:'sb-done'};
  if(s==='delivered')  return {text:l.statusDelivered,  cls:'sb-delivered'};
  if(s==='unrepaired') return {text:l.statusUnrepaired,  cls:'sb-unrepaired'};
  return {text:s,cls:'sb-waiting'};
};

// apply on load
applyLang();
renderDevices();

// register service worker for installability / offline use
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
