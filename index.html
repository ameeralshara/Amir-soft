&lt;button class=&quot;fab&quot; onclick=&quot;openAddDevice()&quot; id=&quot;fab-btn&quot;&gt;+&lt;/button&gt;

&lt;!-- إضافة/تعديل جهاز --&gt;
&lt;div class=&quot;overlay&quot; id=&quot;device-sheet&quot;&gt;
  &lt;div class=&quot;sheet&quot;&gt;
    &lt;div class=&quot;sheet-title&quot;&gt;
      &lt;span id=&quot;dsheet-title&quot;&gt;طلب إصلاح جديد&lt;/span&gt;
      &lt;button class=&quot;close-btn&quot; onclick=&quot;closeSheet(&#x27;device-sheet&#x27;)&quot;&gt;✕&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row2&quot;&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label&gt;اسم العميل&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;d-customer&quot; placeholder=&quot;مثال: أحمد علي&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label&gt;رقم الهاتف&lt;/label&gt;&lt;input type=&quot;tel&quot; id=&quot;d-phone&quot; placeholder=&quot;07XX XXX XXXX&quot; inputmode=&quot;tel&quot; style=&quot;direction:ltr&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row2&quot;&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label&gt;موديل الجهاز&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;d-model&quot; placeholder=&quot;مثال: Samsung A54&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label&gt;رقم الرف&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;d-shelf&quot; placeholder=&quot;مثال: A3&quot; style=&quot;text-transform:uppercase;direction:ltr&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;المشكلة&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;d-issue&quot; placeholder=&quot;مثال: شاشة مكسورة، لا يشحن...&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;row2&quot;&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label&gt;نوع الإصلاح&lt;/label&gt;
        &lt;select id=&quot;d-type&quot;&gt;
          &lt;option value=&quot;إصلاح بورد&quot;&gt;إصلاح بورد&lt;/option&gt;
          &lt;option value=&quot;سوفت وير&quot;&gt;سوفت وير&lt;/option&gt;
          &lt;option value=&quot;أخرى&quot;&gt;أخرى&lt;/option&gt;
        &lt;/select&gt;
      &lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label&gt;السعر المتفق (د.ع)&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;d-price&quot; min=&quot;0&quot; step=&quot;250&quot; placeholder=&quot;0&quot; inputmode=&quot;decimal&quot; style=&quot;direction:ltr&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;ملاحظات&lt;/label&gt;&lt;textarea id=&quot;d-notes&quot; rows=&quot;2&quot; placeholder=&quot;الباسورد، الملحقات، تعليمات خاصة...&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
    &lt;div class=&quot;sheet-actions&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;saveDevice()&quot;&gt;حفظ&lt;/button&gt;
      &lt;button class=&quot;btn&quot; onclick=&quot;closeSheet(&#x27;device-sheet&#x27;)&quot;&gt;إلغاء&lt;/button&gt;
      &lt;button class=&quot;btn btn-red&quot; id=&quot;d-delete-btn&quot; onclick=&quot;deleteDevice()&quot; style=&quot;display:none;flex:0;padding:9px 14px&quot;&gt;🗑&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- سبب عدم الإصلاح --&gt;
&lt;div class=&quot;overlay&quot; id=&quot;unrepaired-sheet&quot;&gt;
  &lt;div class=&quot;sheet&quot;&gt;
    &lt;div class=&quot;sheet-title&quot;&gt;
      &lt;span id=&quot;usheet-title&quot;&gt;لم يصلح الجهاز&lt;/span&gt;
      &lt;button class=&quot;close-btn&quot; onclick=&quot;closeSheet(&#x27;unrepaired-sheet&#x27;)&quot;&gt;✕&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label id=&quot;u-reason-label&quot;&gt;سبب عدم الإصلاح&lt;/label&gt;&lt;textarea id=&quot;u-reason&quot; rows=&quot;3&quot; placeholder=&quot;مثال: القطعة غير متوفرة، الضرر أكبر من المتوقع، العميل لم يوافق على السعر...&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
    &lt;div class=&quot;sheet-actions&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;confirmUnrepaired()&quot; id=&quot;u-confirm-btn&quot;&gt;✓ تأكيد&lt;/button&gt;
      &lt;button class=&quot;btn&quot; onclick=&quot;closeSheet(&#x27;unrepaired-sheet&#x27;)&quot; id=&quot;u-cancel-btn&quot;&gt;إلغاء&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- تفاصيل الجهاز --&gt;
&lt;div class=&quot;overlay&quot; id=&quot;detail-sheet&quot;&gt;
  &lt;div class=&quot;sheet&quot;&gt;
    &lt;div class=&quot;sheet-title&quot;&gt;
      &lt;span&gt;تفاصيل الإصلاح&lt;/span&gt;
      &lt;button class=&quot;close-btn&quot; onclick=&quot;closeSheet(&#x27;detail-sheet&#x27;)&quot;&gt;✕&lt;/button&gt;
    &lt;/div&gt;
    &lt;div id=&quot;detail-body&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- نسخ احتياطي --&gt;
&lt;div class=&quot;overlay&quot; id=&quot;backup-sheet&quot;&gt;
  &lt;div class=&quot;sheet&quot;&gt;
    &lt;div class=&quot;sheet-title&quot;&gt;
      &lt;span&gt;النسخ الاحتياطي&lt;/span&gt;
      &lt;button class=&quot;close-btn&quot; onclick=&quot;closeSheet(&#x27;backup-sheet&#x27;)&quot;&gt;✕&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;backup-section&quot;&gt;
      &lt;div class=&quot;backup-title&quot;&gt;تصدير نسخة احتياطية&lt;/div&gt;
      &lt;div class=&quot;backup-desc&quot;&gt;يحفظ جميع طلبات الإصلاح وبيانات العملاء في ملف JSON. احفظه على Google Drive أو أرسله لنفسك.&lt;/div&gt;
      &lt;div class=&quot;backup-row&quot;&gt;&lt;button class=&quot;btn btn-primary&quot; onclick=&quot;exportData()&quot; style=&quot;flex:1&quot;&gt;تنزيل النسخة الاحتياطية&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;backup-section&quot;&gt;
      &lt;div class=&quot;backup-title&quot;&gt;استعادة من نسخة احتياطية&lt;/div&gt;
      &lt;div class=&quot;backup-desc&quot;&gt;اختر ملف النسخة الاحتياطية. سيستبدل جميع البيانات الحالية.&lt;/div&gt;
      &lt;div class=&quot;backup-row&quot;&gt;
        &lt;input type=&quot;file&quot; id=&quot;import-file&quot; accept=&quot;.json&quot; style=&quot;display:none&quot; onchange=&quot;importData(event)&quot;&gt;
        &lt;button class=&quot;btn&quot; onclick=&quot;document.getElementById(&#x27;import-file&#x27;).click()&quot; style=&quot;flex:1&quot;&gt;اختر ملف&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;closeSheet(&#x27;backup-sheet&#x27;)&quot; style=&quot;width:100%;justify-content:center;margin-top:4px&quot;&gt;إغلاق&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
let devices = JSON.parse(localStorage.getItem(&#x27;devices_v1&#x27;) || &#x27;[]&#x27;);
let editDeviceId=null, unrepairedDeviceId=null;
let jobCounter = parseInt(localStorage.getItem(&#x27;job_counter&#x27;)||&#x27;0&#x27;);

function save(){
  localStorage.setItem(&#x27;devices_v1&#x27;,JSON.stringify(devices));
  localStorage.setItem(&#x27;job_counter&#x27;,String(jobCounter));
}
function money(n){return Number(n).toLocaleString(&#x27;en-US&#x27;)+((localStorage.getItem(&#x27;lang&#x27;)||&#x27;ar&#x27;)===&#x27;ar&#x27;?&#x27; د.ع&#x27;:&#x27; IQD&#x27;);}
function nextJobId(){ jobCounter++; return &#x27;J-&#x27;+String(jobCounter).padStart(4,&#x27;0&#x27;); }
function closeSheet(id){ document.getElementById(id).classList.remove(&#x27;open&#x27;); }

/* ---- الأجهزة ---- */
function statusInfo(s){
  if(s===&#x27;waiting&#x27;)    return {text:&#x27;بانتظار الإصلاح&#x27;, cls:&#x27;sb-waiting&#x27;};
  if(s===&#x27;inprogress&#x27;) return {text:&#x27;قيد الإصلاح&#x27;,     cls:&#x27;sb-inprogress&#x27;};
  if(s===&#x27;done&#x27;)       return {text:&#x27;جاهز ✓&#x27;,           cls:&#x27;sb-done&#x27;};
  if(s===&#x27;delivered&#x27;)  return {text:&#x27;تم التسليم&#x27;,       cls:&#x27;sb-delivered&#x27;};
  if(s===&#x27;unrepaired&#x27;) return {text:&#x27;لم يصلح&#x27;,           cls:&#x27;sb-unrepaired&#x27;};
  return {text:s,cls:&#x27;sb-waiting&#x27;};
}
function openAddDevice(){
  editDeviceId=null;
  document.getElementById(&#x27;dsheet-title&#x27;).textContent=&#x27;طلب إصلاح جديد&#x27;;
  document.getElementById(&#x27;d-delete-btn&#x27;).style.display=&#x27;none&#x27;;
  [&#x27;customer&#x27;,&#x27;phone&#x27;,&#x27;model&#x27;,&#x27;shelf&#x27;,&#x27;issue&#x27;,&#x27;notes&#x27;].forEach(f=&gt;document.getElementById(&#x27;d-&#x27;+f).value=&#x27;&#x27;);
  document.getElementById(&#x27;d-price&#x27;).value=&#x27;&#x27;;
  document.getElementById(&#x27;d-type&#x27;).value=&#x27;سوفت وير&#x27;;
  document.getElementById(&#x27;device-sheet&#x27;).classList.add(&#x27;open&#x27;);
}
function openEditDevice(id){
  const d=devices.find(x=&gt;x.id===id); if(!d) return;
  editDeviceId=id;
  document.getElementById(&#x27;dsheet-title&#x27;).textContent=&#x27;تعديل &#x27;+d.jobId;
  document.getElementById(&#x27;d-delete-btn&#x27;).style.display=&#x27;inline-flex&#x27;;
  document.getElementById(&#x27;d-customer&#x27;).value=d.customer;
  document.getElementById(&#x27;d-phone&#x27;).value=d.phone||&#x27;&#x27;;
  document.getElementById(&#x27;d-model&#x27;).value=d.model;
  document.getElementById(&#x27;d-shelf&#x27;).value=d.shelf||&#x27;&#x27;;
  document.getElementById(&#x27;d-issue&#x27;).value=d.issue||&#x27;&#x27;;
  document.getElementById(&#x27;d-type&#x27;).value=d.type;
  document.getElementById(&#x27;d-price&#x27;).value=d.price||&#x27;&#x27;;
  document.getElementById(&#x27;d-notes&#x27;).value=d.notes||&#x27;&#x27;;
  document.getElementById(&#x27;device-sheet&#x27;).classList.add(&#x27;open&#x27;);
}
function saveDevice(){
  const customer=document.getElementById(&#x27;d-customer&#x27;).value.trim();
  const model=document.getElementById(&#x27;d-model&#x27;).value.trim();
  if(!customer){alert(&#x27;أدخل اسم العميل&#x27;);return;}
  if(!model){alert(&#x27;أدخل موديل الجهاز&#x27;);return;}
  const shelf=(document.getElementById(&#x27;d-shelf&#x27;).value.trim()||&#x27;&#x27;).toUpperCase();
  if(editDeviceId){
    const d=devices.find(x=&gt;x.id===editDeviceId);
    Object.assign(d,{customer,model,shelf,
      phone:document.getElementById(&#x27;d-phone&#x27;).value.trim(),
      issue:document.getElementById(&#x27;d-issue&#x27;).value.trim(),
      type:document.getElementById(&#x27;d-type&#x27;).value,
      price:parseFloat(document.getElementById(&#x27;d-price&#x27;).value)||0,
      notes:document.getElementById(&#x27;d-notes&#x27;).value.trim(),
      updatedAt:new Date().toISOString()
    });
  } else {
    devices.unshift({
      id:Date.now(), jobId:nextJobId(),
      customer, model, shelf,
      phone:document.getElementById(&#x27;d-phone&#x27;).value.trim(),
      issue:document.getElementById(&#x27;d-issue&#x27;).value.trim(),
      type:document.getElementById(&#x27;d-type&#x27;).value,
      price:parseFloat(document.getElementById(&#x27;d-price&#x27;).value)||0,
      notes:document.getElementById(&#x27;d-notes&#x27;).value.trim(),
      status:&#x27;waiting&#x27;,
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString()
    });
  }
  save(); closeSheet(&#x27;device-sheet&#x27;); renderDevices(); updateDeviceStats();
}
function deleteDevice(){
  if(!confirm(&#x27;حذف هذا الطلب؟&#x27;)) return;
  devices=devices.filter(x=&gt;x.id!==editDeviceId);
  save(); closeSheet(&#x27;device-sheet&#x27;); renderDevices(); updateDeviceStats();
}
function setStatus(id,status){
  const d=devices.find(x=&gt;x.id===id); if(!d) return;
  d.status=status; d.updatedAt=new Date().toISOString();
  if(status===&#x27;delivered&#x27;) d.deliveredAt=new Date().toISOString();
  if(status!==&#x27;unrepaired&#x27;) d.unrepairedReason=&#x27;&#x27;;
  save(); closeSheet(&#x27;detail-sheet&#x27;); renderDevices(); updateDeviceStats();
}
function openUnrepairedSheet(id){
  unrepairedDeviceId=id;
  const d=devices.find(x=&gt;x.id===id);
  document.getElementById(&#x27;u-reason&#x27;).value=(d&amp;&amp;d.unrepairedReason)||&#x27;&#x27;;
  document.getElementById(&#x27;unrepaired-sheet&#x27;).classList.add(&#x27;open&#x27;);
}
function confirmUnrepaired(){
  const d=devices.find(x=&gt;x.id===unrepairedDeviceId); if(!d) return;
  d.status=&#x27;unrepaired&#x27;;
  d.unrepairedReason=document.getElementById(&#x27;u-reason&#x27;).value.trim();
  d.updatedAt=new Date().toISOString();
  save(); closeSheet(&#x27;unrepaired-sheet&#x27;); closeSheet(&#x27;detail-sheet&#x27;); renderDevices(); updateDeviceStats();
}
function esc(x){return String(x==null?&#x27;&#x27;:x).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));}
const GROUPS={finished:[&#x27;done&#x27;,&#x27;delivered&#x27;],working:[&#x27;inprogress&#x27;,&#x27;waiting&#x27;],unrepaired:[&#x27;unrepaired&#x27;]};
let view=localStorage.getItem(&#x27;view_v1&#x27;)||&#x27;all&#x27;, sub=&#x27;&#x27;, animate=true;
if(view!==&#x27;all&#x27;&amp;&amp;!GROUPS[view]) view=&#x27;all&#x27;;
function setView(v){view=v;sub=&#x27;&#x27;;animate=true;localStorage.setItem(&#x27;view_v1&#x27;,v);renderDevices();window.scrollTo({top:0,behavior:&#x27;smooth&#x27;});}
function setSub(s){sub=s;animate=false;renderDevices();}
function openDetail(id){
  const d=devices.find(x=&gt;x.id===id); if(!d) return;
  const l=t(), si=statusInfo(d.status), loc=currentLang===&#x27;ar&#x27;?&#x27;ar-IQ&#x27;:&#x27;en-GB&#x27;, c=new Date(d.createdAt);
  const ds=c.toLocaleDateString(loc)+&#x27; &#x27;+c.toLocaleTimeString(loc,{hour:&#x27;2-digit&#x27;,minute:&#x27;2-digit&#x27;});
  let btns=&#x27;&#x27;;
  if(d.status===&#x27;waiting&#x27;)    btns+=`&lt;button class=&quot;btn btn-primary btn-sm&quot; onclick=&quot;setStatus(${d.id},&#x27;inprogress&#x27;)&quot;&gt;${l.startBtn}&lt;/button&gt;`;
  if(d.status===&#x27;inprogress&#x27;) btns+=`&lt;button class=&quot;btn btn-green btn-sm&quot; onclick=&quot;setStatus(${d.id},&#x27;done&#x27;)&quot;&gt;${l.doneBtn}&lt;/button&gt;`;
  if(d.status===&#x27;done&#x27;)       btns+=`&lt;button class=&quot;btn btn-purple btn-sm&quot; onclick=&quot;setStatus(${d.id},&#x27;delivered&#x27;)&quot;&gt;${l.deliveredBtn}&lt;/button&gt;`;
  if(d.status===&#x27;waiting&#x27;||d.status===&#x27;inprogress&#x27;) btns+=`&lt;button class=&quot;btn btn-red btn-sm&quot; onclick=&quot;openUnrepairedSheet(${d.id})&quot;&gt;${l.notRepairedBtn}&lt;/button&gt;`;
  btns+=`&lt;button class=&quot;btn btn-sm&quot; onclick=&quot;closeSheet(&#x27;detail-sheet&#x27;);openEditDevice(${d.id})&quot;&gt;${l.editBtn}&lt;/button&gt;`;
  document.getElementById(&#x27;detail-body&#x27;).innerHTML=`
    &lt;div class=&quot;d-id&quot;&gt;${esc(d.jobId)}&lt;/div&gt;
    &lt;div class=&quot;d-badge&quot;&gt;&lt;span class=&quot;status-badge sb-${d.status}&quot;&gt;${si.text}&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;detail-row&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;d-name&quot;&gt;${esc(d.customer)}&lt;/div&gt;${d.phone?`&lt;div class=&quot;d-phone&quot;&gt;${esc(d.phone)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;
      ${d.shelf?`&lt;div class=&quot;shelf-big&quot;&gt;${esc(d.shelf)}&lt;/div&gt;`:&#x27;&#x27;}
    &lt;/div&gt;
    &lt;div class=&quot;d-model&quot;&gt;${esc(d.model)}&lt;/div&gt;
    &lt;div class=&quot;d-sub&quot;&gt;${esc(d.type)}&lt;/div&gt;
    ${d.issue?`&lt;div class=&quot;d-sub&quot;&gt;${esc(d.issue)}&lt;/div&gt;`:&#x27;&#x27;}
    ${d.status===&#x27;unrepaired&#x27;&amp;&amp;d.unrepairedReason?`&lt;div class=&quot;unrepaired-reason&quot;&gt;&lt;b&gt;${l.reasonLabel}:&lt;/b&gt; ${esc(d.unrepairedReason)}&lt;/div&gt;`:&#x27;&#x27;}
    ${d.price?`&lt;div class=&quot;d-price&quot;&gt;${money(d.price)}&lt;/div&gt;`:&#x27;&#x27;}
    ${d.notes?`&lt;div class=&quot;d-note&quot;&gt;${esc(d.notes)}&lt;/div&gt;`:&#x27;&#x27;}
    &lt;div class=&quot;d-date&quot;&gt;${l.receivedLabel} ${ds}&lt;/div&gt;
    &lt;div class=&quot;d-actions&quot;&gt;${btns}&lt;/div&gt;`;
  document.getElementById(&#x27;detail-sheet&#x27;).classList.add(&#x27;open&#x27;);
}
function renderDevices(){
  const l=t(), q=(document.getElementById(&#x27;device-search&#x27;).value||&#x27;&#x27;).toLowerCase();
  const grp=GROUPS[view]||null, rank={inprogress:0,waiting:1,done:0,delivered:1};
  const list=devices.filter(d=&gt;{
    if(grp&amp;&amp;!grp.includes(d.status)) return false;
    if(sub&amp;&amp;d.status!==sub) return false;
    return !q||(d.jobId+&#x27; &#x27;+d.customer+&#x27; &#x27;+d.model+&#x27; &#x27;+(d.shelf||&#x27;&#x27;)+&#x27; &#x27;+(d.issue||&#x27;&#x27;)).toLowerCase().includes(q);
  });
  if(grp) list.sort((a,b)=&gt;(rank[a.status]||0)-(rank[b.status]||0));
  const names={waiting:l.waiting,inprogress:l.inprogress,done:l.doneF,delivered:l.delivered};
  const inView=devices.filter(d=&gt;!grp||grp.includes(d.status));
  document.getElementById(&#x27;sub-chips&#x27;).innerHTML=(grp&amp;&amp;grp.length&gt;1)
    ?[[&#x27;&#x27;,l.allFilter,inView.length]].concat(grp.map(s=&gt;[s,names[s],devices.filter(d=&gt;d.status===s).length]))
      .map(c=&gt;`&lt;button class=&quot;chip${sub===c[0]?&#x27; active&#x27;:&#x27;&#x27;}&quot; onclick=&quot;setSub(&#x27;${c[0]}&#x27;)&quot;&gt;${c[1]}&lt;b&gt;${c[2]}&lt;/b&gt;&lt;/button&gt;`).join(&#x27;&#x27;):&#x27;&#x27;;
  const el=document.getElementById(&#x27;devices-list&#x27;);
  if(!list.length){el.innerHTML=`&lt;div class=&quot;empty&quot;&gt;${view===&#x27;all&#x27;?l.emptyDevices:l.empty[view]}&lt;/div&gt;`;animate=false;updateDeviceStats();return;}
  el.innerHTML=list.map((d,i)=&gt;{
    const si=statusInfo(d.status);
    const ds=new Date(d.createdAt).toLocaleDateString(currentLang===&#x27;ar&#x27;?&#x27;ar-IQ&#x27;:&#x27;en-GB&#x27;);
    return `&lt;div class=&quot;device-card st-${d.status}${animate?&#x27; enter&#x27;:&#x27;&#x27;}&quot; style=&quot;--i:${Math.min(i,8)}&quot; onclick=&quot;openDetail(${d.id})&quot;&gt;
      &lt;div class=&quot;dc-top&quot;&gt;&lt;span class=&quot;device-id&quot;&gt;${esc(d.jobId)}&lt;/span&gt;&lt;span class=&quot;status-badge sb-${d.status}&quot;&gt;${si.text}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;device-name&quot;&gt;${esc(d.customer)}&lt;/div&gt;
      &lt;div class=&quot;device-model&quot;&gt;${esc(d.model)}&lt;/div&gt;
      ${d.issue?`&lt;div class=&quot;device-issue&quot;&gt;${esc(d.issue)}&lt;/div&gt;`:&#x27;&#x27;}
      ${d.status===&#x27;unrepaired&#x27;&amp;&amp;d.unrepairedReason?`&lt;div class=&quot;unrepaired-reason&quot;&gt;${esc(d.unrepairedReason)}&lt;/div&gt;`:&#x27;&#x27;}
      &lt;div class=&quot;dc-foot&quot;&gt;

// ===== IPSW لوكب =====
function formatFwDate(dateStr){
  if(!dateStr) return &#x27;&#x27;;
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return &#x27;&#x27;;
  const dd = String(d.getDate()).padStart(2,&#x27;0&#x27;);
  const mm = String(d.getMonth()+1).padStart(2,&#x27;0&#x27;);
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}
let ipswDeviceList = JSON.parse(localStorage.getItem(&#x27;ipsw_devices_v1&#x27;) || &#x27;null&#x27;);
let ipswSearchTimer = null;

async function ensureIpswDeviceList(force){
  const ipswTs=Number(localStorage.getItem(&#x27;ipsw_devices_ts&#x27;)||0);
  if(ipswDeviceList &amp;&amp; ipswDeviceList.length &amp;&amp; !force &amp;&amp; Date.now()-ipswTs&lt;86400000) return ipswDeviceList;
  const btn = document.getElementById(&#x27;ipsw-refresh-btn&#x27;);
  if(btn) btn.textContent = &#x27;…&#x27;;
  try{
    const res = await fetch(&#x27;https://api.ipsw.me/v4/devices&#x27;);
    if(!res.ok) throw new Error(&#x27;bad response&#x27;);
    const data = await res.json();
    ipswDeviceList = data.filter(d =&gt; /iphone|ipad/i.test(d.identifier));
    localStorage.setItem(&#x27;ipsw_devices_v1&#x27;, JSON.stringify(ipswDeviceList));
    localStorage.setItem(&#x27;ipsw_devices_ts&#x27;, String(Date.now()));
  }catch(e){
    if(!ipswDeviceList) ipswDeviceList = [];
  }
  if(btn) btn.textContent = &#x27;↻&#x27;;
  return ipswDeviceList;
}
function refreshIpswDeviceList(){ ensureIpswDeviceList(true).then(renderIpswDeviceMatches); }

function identKey(id){const m=/(\d+),(\d+)/.exec(id||&#x27;&#x27;);return m?Number(m[1])*1000+Number(m[2]):0;}
function renderIpswDeviceMatches(){
  clearTimeout(ipswSearchTimer);
  ipswSearchTimer = setTimeout(async ()=&gt;{
    const q = (document.getElementById(&#x27;ipsw-search&#x27;).value||&#x27;&#x27;).trim().toLowerCase();
    const listEl = document.getElementById(&#x27;ipsw-device-matches&#x27;);
    const isAr = currentLang === &#x27;ar&#x27;;
    if(!q){ listEl.innerHTML=&#x27;&#x27;; document.getElementById(&#x27;ipsw-firmware-list&#x27;).innerHTML=&#x27;&#x27;; return; }
    listEl.innerHTML = `&lt;div class=&quot;empty&quot; style=&quot;padding:10px&quot;&gt;${isAr?&#x27;...جارٍ البحث&#x27;:&#x27;Searching...&#x27;}&lt;/div&gt;`;
    const devices = await ensureIpswDeviceList(false);
    const matches = devices.filter(d=&gt;d.name.toLowerCase().includes(q)).sort((a,b)=&gt;identKey(b.identifier)-identKey(a.identifier)).slice(0,60);
    if(!matches.length){
      listEl.innerHTML = `&lt;div class=&quot;empty&quot; style=&quot;padding:10px&quot;&gt;${isAr?&#x27;لا توجد نتائج&#x27;:&#x27;No matches&#x27;}&lt;/div&gt;`;
      return;
    }
    listEl.innerHTML = matches.map(d=&gt;
      `&lt;button class=&quot;btn btn-sm&quot; onclick=&quot;loadIpswFirmwares(&#x27;${d.identifier}&#x27;,this)&quot;&gt;${d.name} &lt;span style=&quot;font-size:11px;color:var(--text3)&quot;&gt;${d.identifier}&lt;/span&gt;&lt;/button&gt;`
    ).join(&#x27;&#x27;);
  }, 300);
}

async function loadIpswFirmwares(identifier, btnEl){
  document.querySelectorAll(&#x27;#ipsw-device-matches .btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;btn-primary&#x27;));
  if(btnEl) btnEl.classList.add(&#x27;btn-primary&#x27;);
  const isAr = currentLang === &#x27;ar&#x27;;
  const fwEl = document.getElementById(&#x27;ipsw-firmware-list&#x27;);
  fwEl.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${isAr?&#x27;...جاري التحميل&#x27;:&#x27;Loading...&#x27;}&lt;/div&gt;`;
  try{
    const res = await fetch(`https://api.ipsw.me/v4/device/${identifier}?type=ipsw`);
    if(!res.ok) throw new Error(&#x27;bad response&#x27;);
    const data = await res.json();
    const fws = (data.firmwares||[]).slice();
    if(!fws.length){
      fwEl.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${isAr?&#x27;لا توجد نسخ متوفرة&#x27;:&#x27;No firmwares found&#x27;}&lt;/div&gt;`;
      return;
    }
    const groups = {};
    fws.forEach(f=&gt;{
      const major = String(f.version).split(&#x27;.&#x27;)[0];
      if(!groups[major]) groups[major] = [];
      groups[major].push(f);
    });
    const majors = Object.keys(groups).sort((a,b)=&gt;Number(b)-Number(a));
    majors.forEach(m=&gt;{
      groups[m].sort((a,b)=&gt;{
        const pa = String(a.version).split(&#x27;.&#x27;).map(Number);
        const pb = String(b.version).split(&#x27;.&#x27;).map(Number);
        for(let i=0;i&lt;Math.max(pa.length,pb.length);i++){
          const va = pa[i]||0, vb = pb[i]||0;
          if(va!==vb) return vb-va;
        }
        return 0;
      });
    });
    const devName = (ipswDeviceList.find(d=&gt;d.identifier===identifier)||{}).name || identifier;
    const board = data.boardconfig || (data.boards &amp;&amp; data.boards[0] &amp;&amp; data.boards[0].boardconfig) || &#x27;&#x27;;
    fwEl.innerHTML = `
      &lt;div style=&quot;font-size:13px;font-weight:700;margin-bottom:10px&quot;&gt;${devName} &lt;span style=&quot;font-size:11px;font-weight:400;color:var(--text3)&quot;&gt;${identifier}${board?&#x27; · &#x27;+board:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;
    ` + majors.map(m=&gt;`
      &lt;div style=&quot;font-size:13px;font-weight:800;margin:14px 0 6px;color:var(--text2)&quot;&gt;iOS ${m}&lt;/div&gt;
      ${groups[m].map(f=&gt;`
        &lt;div class=&quot;part-card&quot; style=&quot;margin-bottom:8px&quot;&gt;
          &lt;div style=&quot;display:flex;justify-content:space-between;align-items:center;gap:10px&quot;&gt;
            &lt;div&gt;
              &lt;div style=&quot;font-weight:700&quot;&gt;iOS ${f.version} &lt;span style=&quot;font-size:11px;color:var(--text3)&quot;&gt;(${f.buildid})&lt;/span&gt;&lt;/div&gt;
              &lt;div style=&quot;font-size:12px;color:${f.signed?&#x27;var(--green)&#x27;:&#x27;var(--red)&#x27;};margin-top:2px&quot;&gt;
                ${f.signed ? (isAr?&#x27;✓ موقّع حالياً (يمكن التثبيت)&#x27;:&#x27;✓ Currently signed&#x27;) : (isAr?&#x27;✕ غير موقّع&#x27;:&#x27;✕ Not signed&#x27;)}
              &lt;/div&gt;
              ${f.releasedate ? `&lt;div style=&quot;font-size:11px;color:var(--text3);margin-top:2px&quot;&gt;${isAr?&#x27;تاريخ الإصدار: &#x27;:&#x27;Released: &#x27;}${formatFwDate(f.releasedate)}&lt;/div&gt;` : &#x27;&#x27;}
            &lt;/div&gt;
            &lt;a class=&quot;btn btn-sm btn-primary&quot; href=&quot;${f.url}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;${isAr?&#x27;تنزيل&#x27;:&#x27;Download&#x27;}&lt;/a&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `).join(&#x27;&#x27;)}
    `).join(&#x27;&#x27;);
  }catch(e){
    fwEl.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${isAr?&#x27;تعذر الاتصال بالخادم. تحقق من الإنترنت.&#x27;:&#x27;Could not reach server. Check connection.&#x27;}&lt;/div&gt;`;
  }
}

  &#x27;iPhone 15&#x27;,&#x27;iPhone 15 Plus&#x27;,&#x27;iPhone 15 Pro&#x27;,&#x27;iPhone 15 Pro Max&#x27;,
  &#x27;iPhone 16&#x27;,&#x27;iPhone 16 Plus&#x27;,&#x27;iPhone 16 Pro&#x27;,&#x27;iPhone 16 Pro Max&#x27;
];
let ipswBulkResults = [];
let ipadBulkResults = [];

async function bulkFetchLatest(kind){
  const isAr = currentLang === &#x27;ar&#x27;;
  const isIpad = kind === &#x27;ipad&#x27;;
  const btn = document.getElementById(isIpad ? &#x27;ipad-bulk-btn&#x27; : &#x27;ipsw-bulk-btn&#x27;);
  const prog = document.getElementById(isIpad ? &#x27;ipad-bulk-progress&#x27; : &#x27;ipsw-bulk-progress&#x27;);
  const listEl = document.getElementById(isIpad ? &#x27;ipad-bulk-list&#x27; : &#x27;ipsw-bulk-list&#x27;);
  const exportRow = document.getElementById(isIpad ? &#x27;ipad-bulk-export-row&#x27; : &#x27;ipsw-bulk-export-row&#x27;);
  btn.disabled = true;
  exportRow.style.display = &#x27;none&#x27;;
  listEl.innerHTML = &#x27;&#x27;;
  let results = [];

  const devices = await ensureIpswDeviceList(false);
  let targets = [];

  if(isIpad){
    // No hardcoded model-name list here on purpose: iPad naming/suffixes (Wi-Fi vs
    // Wi-Fi+Cellular, generation labels) shift more than iPhone&#x27;s and a stale hardcoded
    // list would silently drop new models the same way the old iPhone X bug did.
    // Instead, pull every device whose identifier starts with &quot;iPad&quot; and dedupe by name.
    const seenNames = new Set();
    devices.filter(d=&gt;/^ipad/i.test(d.identifier)).forEach(d=&gt;{
      if(!seenNames.has(d.name)){ seenNames.add(d.name); targets.push(d); }
    });
  } else {
    const iph = devices
      .filter(d=&gt;/^iphone/i.test(d.identifier) &amp;&amp; identKey(d.identifier) &gt;= 7000)
      .sort((a,b)=&gt;(/\bgsm\b/i.test(a.name)?1:0)-(/\bgsm\b/i.test(b.name)?1:0));
    const seenKeys = new Set();
    iph.forEach(d=&gt;{
      const k = d.name.replace(/\s*\((?:GSM\/CDMA|GSM|CDMA|Global)\)\s*$/i,&#x27;&#x27;).trim().toLowerCase();
      if(!seenKeys.has(k)){ seenKeys.add(k); targets.push(d); }
    });
    targets.sort((a,b)=&gt;identKey(b.identifier)-identKey(a.identifier));
  }

  for(let i=0;i&lt;targets.length;i++){
    const dev = targets[i];
    prog.textContent = (isAr?`جاري الجلب: `:`Fetching: `) + dev.name + ` (${i+1}/${targets.length})`;
    try{
      const res = await fetch(`https://api.ipsw.me/v4/device/${dev.identifier}?type=ipsw`);
      const data = await res.json();
      const fws = (data.firmwares||[]);
      const latestSigned = fws.find(f=&gt;f.signed);
      const board = data.boardconfig || (data.boards &amp;&amp; data.boards[0] &amp;&amp; data.boards[0].boardconfig) || &#x27;&#x27;;
      if(latestSigned){
        results.push({name:dev.name, identifier:dev.identifier, board:board, version:latestSigned.version, buildid:latestSigned.buildid, url:latestSigned.url, releasedate:latestSigned.releasedate});
      }
    }catch(e){ /* skip failed device, continue */ }
  }

  if(isIpad) ipadBulkResults = results; else ipswBulkResults = results;

  prog.textContent = isAr
    ? `تم: ${results.length} من ${targets.length} جهاز`
    : `Done: ${results.length} of ${targets.length} devices`;
  btn.disabled = false;

  listEl.innerHTML = groupBulkByFirmware(results).map(g=&gt;`
    &lt;div class=&quot;part-card&quot; style=&quot;margin-bottom:8px&quot;&gt;
      &lt;div style=&quot;display:flex;justify-content:space-between;align-items:center;gap:10px&quot;&gt;
        &lt;div&gt;
          &lt;div style=&quot;font-weight:700&quot;&gt;${g.names.join(&#x27; + &#x27;)} &lt;span style=&quot;font-size:11px;font-weight:400;color:var(--text3)&quot;&gt;${g.identifiers.join(&#x27;, &#x27;)}&lt;/span&gt;&lt;/div&gt;
          &lt;div style=&quot;font-size:12px;color:var(--text2)&quot;&gt;iOS ${g.version} &lt;span style=&quot;color:var(--text3)&quot;&gt;(${g.buildid})&lt;/span&gt;&lt;/div&gt;
          ${g.releasedate ? `&lt;div style=&quot;font-size:11px;color:var(--text3);margin-top:2px&quot;&gt;${currentLang===&#x27;ar&#x27;?&#x27;تاريخ الإصدار: &#x27;:&#x27;Released: &#x27;}${formatFwDate(g.releasedate)}&lt;/div&gt;` : &#x27;&#x27;}
        &lt;/div&gt;
        &lt;a class=&quot;btn btn-sm btn-primary&quot; href=&quot;${g.url}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;⬇&lt;/a&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `).join(&#x27;&#x27;);

  if(results.length) exportRow.style.display = &#x27;flex&#x27;;
}

function groupBulkByFirmware(results){
  const byUrl = {};
  const order = [];
  results.forEach(r=&gt;{
    if(!byUrl[r.url]){
      byUrl[r.url] = {names:[], identifiers:[], boards:[], version:r.version, buildid:r.buildid, url:r.url, releasedate:r.releasedate};
      order.push(r.url);
    }
    byUrl[r.url].names.push(r.name);
    byUrl[r.url].identifiers.push(r.board ? `${r.identifier} · ${r.board}` : r.identifier);
    if(r.board) byUrl[r.url].boards.push(r.board);
  });
  return order.map(u=&gt;byUrl[u]);
}

function exportBulkLinks(kind){
  const results = kind === &#x27;ipad&#x27; ? ipadBulkResults : ipswBulkResults;
  if(!results.length) return;
  const uniqueUrls = [...new Set(results.map(r=&gt;r.url))];
  const lines = uniqueUrls.join(&#x27;\n&#x27;);
  const blob = new Blob([lines], {type:&#x27;text/plain&#x27;});
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&#x27;a&#x27;);
  a.href = url;
  a.download = kind === &#x27;ipad&#x27; ? &#x27;ameer_soft_ipad_links.txt&#x27; : &#x27;ameer_soft_ipsw_links.txt&#x27;;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        &lt;/div&gt;
      &lt;/div&gt;
      ${e.type===&#x27;edge&#x27; ? `&lt;table class=&quot;isp-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pin&lt;/th&gt;&lt;th&gt;Note&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${pinRows||&#x27;&lt;tr&gt;&lt;td colspan=2 style=&quot;color:var(--text3)&quot;&gt;No pins logged yet&lt;/td&gt;&lt;/tr&gt;&#x27;}&lt;/tbody&gt;&lt;/table&gt;` : `
        &lt;div class=&quot;isp-notes&quot;&gt;&lt;strong&gt;Board marker:&lt;/strong&gt; ${ispEsc(e.marker||&quot;—&quot;)}  ${e.layer?(&quot;· &quot;+ispEsc(e.layer)):&quot;&quot;}&lt;/div&gt;`}
      ${e.photo?`&lt;img class=&quot;isp-photo&quot; src=&quot;${e.photo}&quot;&gt;`:&quot;&quot;}
      ${e.notes?`&lt;div class=&quot;isp-notes&quot;&gt;${ispEsc(e.notes)}&lt;/div&gt;`:&quot;&quot;}
      &lt;div class=&quot;isp-notes&quot;&gt;Source: ${ispEsc(e.source||&quot;—&quot;)}&lt;/div&gt;
      &lt;div class=&quot;backup-row&quot; style=&quot;margin-top:10px&quot;&gt;
        &lt;button class=&quot;btn btn-sm&quot; onclick=&quot;ispOpenEditor(&#x27;${e.id}&#x27;)&quot;&gt;Edit&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }).join(&quot;&quot;);
}

function ispToggleTypeFields(){
  const t = document.getElementById(&quot;isp_f_type&quot;).value;
  document.getElementById(&quot;isp-edgeFields&quot;).style.display = t===&quot;edge&quot; ? &quot;block&quot;:&quot;none&quot;;
  document.getElementById(&quot;isp-drillFields&quot;).style.display = t===&quot;drill&quot; ? &quot;block&quot;:&quot;none&quot;;
}
function ispBuildPinGrid(existing){
  const grid = document.getElementById(&quot;isp-pinGrid&quot;);
  grid.innerHTML = ISP_PIN_LABELS.map(label=&gt;{
    const val = existing &amp;&amp; existing[label] ? existing[label] : &quot;&quot;;
    return `&lt;input data-pin=&quot;${ispEsc(label)}&quot; placeholder=&quot;${ispEsc(label)}&quot; value=&quot;${ispEsc(val)}&quot;&gt;`;
  }).join(&quot;&quot;);
}
function ispOpenEditor(id){
  ispBuildPinGrid();
  document.getElementById(&quot;isp-delBtn&quot;).style.display = id ? &quot;inline-flex&quot; : &quot;none&quot;;
  document.getElementById(&quot;ispDlgTitle&quot;).textContent = id ? &quot;Edit entry&quot; : &quot;New entry&quot;;
  document.getElementById(&quot;isp_editId&quot;).value = id || &quot;&quot;;
  if (id){
    const e = ispDb.find(x=&gt;x.id===id);
    document.getElementById(&quot;isp_f_brand&quot;).value = e.brand;
    document.getElementById(&quot;isp_f_model&quot;).value = e.model;
    document.getElementById(&quot;isp_f_chipset&quot;).value = e.chipset||&quot;&quot;;
    document.getElementById(&quot;isp_f_storage&quot;).value = e.storage||&quot;eMMC&quot;;
    document.getElementById(&quot;isp_f_type&quot;).value = e.type;
    document.getElementById(&quot;isp_f_conf&quot;).value = e.confidence;
    document.getElementById(&quot;isp_f_source&quot;).value = e.source||&quot;&quot;;
    document.getElementById(&quot;isp_f_marker&quot;).value = e.marker||&quot;&quot;;
    document.getElementById(&quot;isp_f_layer&quot;).value = e.layer||&quot;&quot;;
    document.getElementById(&quot;isp_f_notes&quot;).value = e.notes||&quot;&quot;;
    document.getElementById(&quot;isp_f_confirmeddrill&quot;).checked = !!e.confirmedDrill;
    ispBuildPinGrid(e.pins);
  } else {
    [&quot;isp_f_brand&quot;,&quot;isp_f_model&quot;,&quot;isp_f_chipset&quot;,&quot;isp_f_source&quot;,&quot;isp_f_marker&quot;,&quot;isp_f_layer&quot;,&quot;isp_f_notes&quot;].forEach(id=&gt;document.getElementById(id).value=&quot;&quot;);
    document.getElementById(&quot;isp_f_type&quot;).value = &quot;edge&quot;;
    document.getElementById(&quot;isp_f_conf&quot;).value = &quot;community&quot;;
    document.getElementById(&quot;isp_f_confirmeddrill&quot;).checked = false;
  }
  ispToggleTypeFields();
  document.getElementById(&quot;isp-dialog&quot;).showModal();
}
function ispCloseEditor(){ document.getElementById(&quot;isp-dialog&quot;).close(); }
function ispSaveEntry(){
  const id = document.getElementById(&quot;isp_editId&quot;).value || (&quot;e&quot;+Date.now());
  const type = document.getElementById(&quot;isp_f_type&quot;).value;
  const pins = {};
  if (type===&quot;edge&quot;){
    document.querySelectorAll(&quot;#isp-pinGrid input&quot;).forEach(inp=&gt;{
      if (inp.value.trim()) pins[inp.dataset.pin] = inp.value.trim();
    });
  }
  const finish = (photoData)=&gt;{
    const entry = {
      id, brand: document.getElementById(&quot;isp_f_brand&quot;).value.trim(),
      model: document.getElementById(&quot;isp_f_model&quot;).value.trim(),
      chipset: document.getElementById(&quot;isp_f_chipset&quot;).value.trim(),
      storage: document.getElementById(&quot;isp_f_storage&quot;).value,
      type, confidence: document.getElementById(&quot;isp_f_conf&quot;).value,
      source: document.getElementById(&quot;isp_f_source&quot;).value.trim(),
      pins,
      marker: document.getElementById(&quot;isp_f_marker&quot;).value.trim(),
      layer: document.getElementById(&quot;isp_f_layer&quot;).value.trim(),
      photo: photoData,
      confirmedDrill: type===&quot;drill&quot; ? document.getElementById(&quot;isp_f_confirmeddrill&quot;).checked : false,
      notes: document.getElementById(&quot;isp_f_notes&quot;).value.trim()
    };
    if (!entry.brand || !entry.model){ alert(&quot;Brand and model are required.&quot;); return; }
    const idx = ispDb.findIndex(x=&gt;x.id===id);
    if (idx&gt;-1) ispDb[idx] = entry; else ispDb.push(entry);
    ispSave(); ispCloseEditor(); ispRender();
  };
  const photoInput = document.getElementById(&quot;isp_f_photo&quot;);
  const existing = ispDb.find(x=&gt;x.id===id);
  if (photoInput.files &amp;&amp; photoInput.files[0]){
    const reader = new FileReader();
    reader.onload = ()=&gt;finish(reader.result);
    reader.readAsDataURL(photoInput.files[0]);
  } else {
    finish(existing ? existing.photo : &quot;&quot;);
  }
}
function ispDeleteCurrent(){
  const id = document.getElementById(&quot;isp_editId&quot;).value;
  if (!id) return;
  if (!confirm(&quot;Delete this entry?&quot;)) return;
  ispDb = ispDb.filter(x=&gt;x.id!==id);
  ispSave(); ispCloseEditor(); ispRender();
}
function ispExportData(){
  const blob = new Blob([JSON.stringify(ispDb,null,2)], {type:&quot;application/json&quot;});
  const a = document.createElement(&quot;a&quot;);
  a.href = URL.createObjectURL(blob);
  a.download = &quot;isp-pinout-db.json&quot;;
  a.click();
}
function ispImportData(ev){
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ()=&gt;{
    try{
      const incoming = JSON.parse(reader.result);
      if (!Array.isArray(incoming)) throw new Error(&quot;bad format&quot;);
      const existingIds = new Set(ispDb.map(e=&gt;e.id));
      incoming.forEach(e=&gt;{ if(!existingIds.has(e.id)) ispDb.push(e); });
      ispSave(); ispRender();
      alert(&quot;Imported &quot;+incoming.length+&quot; entries (duplicates by id skipped).&quot;);
    }catch(err){ alert(&quot;Import failed: not a valid export file.&quot;); }
  };
  reader.readAsText(file);
}

applyLang();
renderOppoRegionButtons();
renderBrandSelector();
showBrand(currentBrand);
renderModeSelector();
showMode(currentMode);
&lt;/script&gt;
&lt;/body&gt;
